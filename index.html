
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101014">
<title>Loobee — Watch, Upload, Share</title>
<style>
:root {
  color-scheme: dark;
  --bg:#101014; --panel:#1a1a22; --line:#30303b;
  --text:#f5f5fa; --muted:#aaaaba; --red:#f32642;
  --purple:#8b5cf6; --blue:#3b82f6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#2a2a34;color:white}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:wait}
input,textarea,select{width:100%;padding:12px;background:#111116;border:1px solid #393943;border-radius:9px;color:white}
input:focus,textarea:focus,select:focus{outline:1px solid var(--purple)}
label{display:block;margin:13px 0 6px;color:#ddd}
header{position:sticky;top:0;z-index:5;background:#101014f5;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:800;cursor:pointer}
.logo-mark{background:var(--red);border-radius:8px;padding:5px 11px}
.search{display:flex;gap:8px;max-width:620px;flex:1;margin:auto}
.header-actions{display:flex;gap:8px;align-items:center}
.primary{background:var(--red);font-weight:bold}
.hidden{display:none!important}
.layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:calc(100vh - 65px)}
.sidebar{padding:17px 10px;border-right:1px solid var(--line)}
.nav{display:block;width:100%;text-align:left;background:transparent;margin:4px 0}
.nav.active,.nav:hover{background:#292934}
main{padding:24px;min-width:0}
h1{font-size:26px;margin:0 0 8px}
.sub,.meta{color:var(--muted)}
.sub{margin:0 0 22px}
.chips,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.chip{background:#22222b;border:1px solid var(--line)}
.chip.active{background:#eee;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 15px}
.video{min-width:0;cursor:pointer}
.thumb{height:145px;background:#22222a;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center;position:relative;color:#aaa}
.thumb img{width:100%;height:100%;object-fit:cover}
.play{position:absolute;background:#000a;padding:7px 11px;border-radius:8px}
.video h3{font-size:15px;line-height:1.4;margin:10px 0 5px;overflow-wrap:anywhere}
.channel-card,.panel,.stream-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px;margin:12px 0}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--red));display:grid;place-items:center;font-weight:bold;font-size:20px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.verified{display:inline-grid;place-items:center;background:var(--blue);width:17px;height:17px;border-radius:50%;font-size:11px;color:white;margin-left:5px}
.empty{padding:40px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}
.error{color:#ff9aaa;background:#3b1820;padding:12px;border-radius:9px;white-space:pre-wrap;margin:10px 0}
.success{color:#9cebb2}
.modal{position:fixed;inset:0;z-index:10;background:#000c;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:23px;width:min(620px,100%);max-height:90vh;overflow:auto}
.dialog h2{margin-top:0}
.form-row{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.form-row>*{flex:1;min-width:120px}
.setting{display:flex;align-items:center;gap:8px}
.setting input{width:auto}
.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;max-width:1600px;margin:22px auto;padding:0 22px}
.player-box{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.watch-player{width:100%;height:100%;object-fit:contain}
.watch-title{font-size:23px;margin:15px 0}
.watch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.channel-line{display:flex;align-items:center;gap:10px}
.description{white-space:pre-wrap;overflow-wrap:anywhere;background:#22222b;padding:15px;border-radius:12px;margin-top:16px}
.comment{padding:12px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.comment p{white-space:pre-wrap}
.comment-form{display:flex;gap:8px;margin:14px 0}
.comment-form input{min-width:0}
.comment-user{background:none;padding:0;font-weight:bold}
.recommendation{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;margin:12px 0;cursor:pointer}
.recommendation .thumb{height:auto;aspect-ratio:16/9}
.profile-view{max-width:1100px;margin:25px auto;padding:0 20px}
.banner{width:100%;height:190px;object-fit:cover;border-radius:15px;background:linear-gradient(120deg,#312e81,#8b5cf6,#f32642);margin-bottom:16px}
.profile-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.profile-avatar{width:90px;height:90px;border-radius:50%;background:var(--purple);display:grid;place-items:center;overflow:hidden;font-size:32px;font-weight:bold}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-about{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.status{white-space:pre-wrap;margin:12px 0;color:#c4b5fd}
.stream-card h3{margin:6px 0}
footer{padding:25px;color:var(--muted);text-align:center;border-top:1px solid var(--line);margin-top:30px}
@media(max-width:900px){.watch-layout{grid-template-columns:1fr}}
@media(max-width:700px){
 header{padding:10px}.logo{font-size:20px}.search{order:3;flex-basis:100%}
 .layout{grid-template-columns:1fr}.sidebar{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px}
 .nav{width:auto;white-space:nowrap}main{padding:15px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:17px 10px}
 .thumb{height:110px}.watch-layout{padding:0 10px}.recommendation{grid-template-columns:120px minmax(0,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="logo" id="homeLogo"><span class="logo-mark">L</span> Loobee</div>
  <form class="search" id="searchForm">
    <input id="searchInput" placeholder="Search Loobee" aria-label="Search videos">
    <button type="submit">Search</button>
  </form>
  <div class="header-actions">
    <button id="uploadOpen" class="primary">＋ Upload</button>
    <button id="profileOpen" class="hidden"><span id="headerUsername">Profile</span></button>
    <button id="authOpen">Sign in</button>
  </div>
</header>

<div id="browseView">
  <div class="layout">
    <aside class="sidebar">
      <button class="nav active" data-page="home">⌂ Home</button>
      <button class="nav" data-page="channels">◎ Channels</button>
      <button class="nav" data-page="subscriptions">♡ Subscriptions</button>
      <button class="nav" data-page="myvideos">▣ My videos</button>
      <button class="nav" data-page="trending">↗ Trending</button>
      <button class="nav" data-page="live">● Live streams</button>
      <button class="nav hidden" id="adminNav" data-page="admin">🛡 Admin</button>
    </aside>
    <main>
      <h1 id="pageTitle">Explore Loobee</h1>
      <p id="pageSubtitle" class="sub">Videos uploaded by the Loobee community.</p>
      <div class="chips" id="chips">
        <button class="chip active" data-category="All">All</button>
        <button class="chip" data-category="Gaming">Gaming</button>
        <button class="chip" data-category="Music">Music</button>
        <button class="chip" data-category="Tech">Tech</button>
        <button class="chip" data-category="Other">Other</button>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="content" class="grid"></div>
    </main>
  </div>
</div>

<div id="watchView" class="hidden">
  <div class="watch-layout">
    <section>
      <div class="player-box">
        <video id="watchPlayer" class="watch-player" controls playsinline preload="metadata"></video>
      </div>
      <h1 id="watchTitle" class="watch-title">Loading video…</h1>
      <div class="watch-row">
        <div class="channel-line">
          <div class="avatar" id="watchAvatar">L</div>
          <div><strong id="watchChannel">Creator</strong><div class="meta" id="watchSubs"></div></div>
          <button id="subscribeBtn" class="primary hidden">Subscribe</button>
        </div>
        <div class="actions">
          <button id="likeBtn">👍 <span id="likeCount">0</span></button>
          <button id="dislikeBtn">👎 <span id="dislikeCount">0</span></button>
          <button id="shareBtn">↗ Share</button>
        </div>
      </div>
      <div id="watchNotice" class="status" aria-live="polite"></div>
      <div class="description"><strong id="watchStats">Loobee video</strong><p id="watchDescription"></p></div>
      <div id="creatorTools" class="actions hidden">
        <button id="toggleCommentsBtn">Disable comments</button>
        <button id="togglePrivateBtn">Make private</button>
      </div>
      <section>
        <h2>Comments <span id="commentCount" class="meta"></span></h2>
        <div id="commentArea"></div>
      </section>
    </section>
    <aside>
      <div class="watch-row"><h2>Up next</h2><button id="backBrowse">Browse</button></div>
      <div id="recommendations"></div>
    </aside>
  </div>
</div>

<div id="profileView" class="hidden">
  <div class="profile-view">
    <button id="profileBack">← Back</button>
    <p id="profileNotice" class="status"></p>
    <img id="profileBanner" class="banner hidden" alt="Channel banner">
    <section class="profile-hero">
      <div id="profileAvatar" class="profile-avatar">?</div>
      <div style="flex:1;min-width:200px">
        <h1 id="profileName">Profile</h1>
        <p id="profileEmail" class="meta">Loobee creator</p>
        <div id="profileAbout" class="profile-about"></div>
      </div>
      <button id="editProfileBtn" class="primary hidden">Edit profile</button>
      <button id="profileSubscribeBtn" class="primary hidden">Subscribe</button>
    </section>
    <section id="profileEditPanel" class="panel hidden">
      <h2>Edit profile</h2>
      <form id="profileForm">
        <label for="profileUsernameInput">Username</label>
        <input id="profileUsernameInput" maxlength="40" required>
        <label for="profileAboutInput">About</label>
        <textarea id="profileAboutInput" maxlength="1000" rows="4"></textarea>
        <label for="profileAvatarFile">Profile picture</label>
        <input id="profileAvatarFile" type="file" accept="image/png,image/jpeg,image/webp">
        <label for="profileBannerFile">Channel banner</label>
        <input id="profileBannerFile" type="file" accept="image/png,image/jpeg,image/webp">
        <div class="form-row"><button class="primary" type="submit">Save profile</button><button type="button" id="cancelProfileEdit">Cancel</button></div>
      </form>
    </section>
    <h2>Videos</h2>
    <div id="profileVideos" class="grid"></div>
  </div>
</div>

<div id="authModal" class="modal">
  <div class="dialog">
    <button style="float:right" data-close="authModal">✕</button>
    <h2>Welcome to Loobee</h2>
    <p class="meta">Sign in or create an account.</p>
    <button class="primary" id="googleLogin" style="width:100%">Continue with Google</button>
    <p class="meta" style="text-align:center">or use email</p>
    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" minlength="6" autocomplete="current-password" required>
      <div class="form-row"><button class="primary" type="submit">Sign in</button><button type="button" id="signup">Create account</button></div>
    </form>
    <div id="authMessage" class="status" aria-live="polite"></div>
  </div>
</div>

<div id="uploadModal" class="modal">
  <div class="dialog">
    <button style="float:right" data-close="uploadModal">✕</button>
    <h2>Upload a video</h2>
    <form id="uploadForm">
      <label for="videoTitle">Title</label>
      <input id="videoTitle" maxlength="120" required>
      <label for="videoDescription">Description</label>
      <textarea id="videoDescription" rows="3" maxlength="3000"></textarea>
      <label for="videoCategory">Category</label>
      <select id="videoCategory"><option>Gaming</option><option>Music</option><option>Tech</option><option>Other</option></select>
      <label for="videoFile">Video file (max 500 MB)</label>
      <input id="videoFile" type="file" accept="video/*" required>
      <label for="thumbnailFile">Thumbnail (optional)</label>
      <input id="thumbnailFile" type="file" accept="image/png,image/jpeg,image/webp">
      <label class="setting"><input id="uploadPrivate" type="checkbox"> Mark private</label>
      <div class="form-row"><button class="primary" type="submit">Upload video</button><button type="button" data-close="uploadModal">Cancel</button></div>
      <div id="uploadMessage" class="status"></div>
    </form>
  </div>
</div>

<div id="featureModal" class="modal">
  <div class="dialog">
    <button style="float:right" data-close="featureModal">✕</button>
    <h2 id="featureModalTitle">Loobee</h2>
    <div id="featureModalContent"></div>
    <div id="featureModalStatus" class="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Part 2 continues here: paste the JavaScript before the closing body tag. -->

<script>
"use strict";

/* ========== SUPABASE CONFIGURATION ========== */
const SUPABASE_URL = "https://npnxfvqnjdvqgyecoxdu.supabase.co";
const SUPABASE_KEY = "sb_publishable_jH73fmYtkQ1Vkz2BsrK4Wg_SSZFvcjB";

const ADMIN_EMAIL = "lowvr81@gmail.com";
const MEDIA_BUCKET = "loobee-media";
const MAX_VIDEO_SIZE = 500 * 1024 * 1024;

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

let user = null;
let currentPage = "home";
let currentCategory = "All";
let currentVideo = null;
let currentProfile = null;
let allVideos = [];
let searchTerm = "";
let busy = false;

const titles = {
  home:["Explore Loobee","Videos uploaded by the Loobee community."],
  channels:["Channels","Discover Loobee creators."],
  subscriptions:["Subscriptions","Videos from creators you follow."],
  myvideos:["My videos","Manage videos you uploaded."],
  trending:["Trending","Popular videos on Loobee."],
  live:["Live streams","Discover live-stream listings."],
  admin:["Admin panel","Manage account verification."]
};

function message(id, text, error = false) {
  const el = $(id);
  if (!el) return;
  el.textContent = text || "";
  el.classList.toggle("error", error && !!text);
}

function setBusy(button, value, originalText) {
  if (!button) return;
  button.disabled = value;
  if (value) button.dataset.oldText = button.textContent;
  else button.textContent = originalText || button.dataset.oldText || button.textContent;
  if (value) button.textContent = "Please wait…";
}

function isAdmin() {
  return !!user && user.email?.toLowerCase() === ADMIN_EMAIL;
}

function showView(name) {
  ["browseView","watchView","profileView"].forEach(id =>
    $(id).classList.toggle("hidden",
      id !== ({browse:"browseView",watch:"watchView",profile:"profileView"}[name]))
  );
}

function showModal(id) {
  $(id)?.classList.add("open");
}

function closeModal(id) {
  $(id)?.classList.remove("open");
}

document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => closeModal(button.dataset.close));
});

document.querySelectorAll(".modal").forEach(modal => {
  modal.addEventListener("click", event => {
    if (event.target === modal) modal.classList.remove("open");
  });
});

function initials(name) {
  return String(name || "?").trim().slice(0, 1).toUpperCase();
}

function safeHttpUrl(value) {
  try {
    const url = new URL(value);
    return ["https:","http:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

function publicMediaUrl(path) {
  if (!path) return "";
  if (/^https:\/\//i.test(path)) return safeHttpUrl(path);
  const clean = path.split("/").map(encodeURIComponent).join("/");
  return `${SUPABASE_URL}/storage/v1/object/public/${MEDIA_BUCKET}/${clean}`;
}

async function privateMediaUrl(path) {
  if (!path) return "";
  if (/^https:\/\//i.test(path)) return safeHttpUrl(path);

  const { data, error } = await db.storage
    .from(MEDIA_BUCKET)
    .createSignedUrl(path, 3600);

  if (error) {
    console.warn("Could not load profile image:", error.message);
    return "";
  }
  return data?.signedUrl || "";
}

function avatarHtml(name, url, extraClass = "") {
  const image = url
    ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
    : esc(initials(name));

  return `<div class="avatar ${extraClass}">${image}</div>`;
}

function verifiedHtml(profile) {
  return profile?.is_verified
    ? '<span class="verified" title="Verified creator" aria-label="Verified creator">✓</span>'
    : "";
}

async function getProfile(id) {
  if (!id) return null;

  const { data, error } = await db.from("profiles")
    .select("id,username,about,avatar_url,banner_url,is_verified,created_at")
    .eq("id", id)
    .maybeSingle();

  if (error) console.warn("Profile lookup:", error.message);
  return data || null;
}

/* ========== AUTHENTICATION ========== */

async function refreshAuth() {
  const { data, error } = await db.auth.getSession();
  if (error) console.warn(error.message);
  user = data?.session?.user || null;
  updateAuthUi();
}

function updateAuthUi() {
  $("authOpen").textContent = user ? "Sign out" : "Sign in";
  $("profileOpen").classList.toggle("hidden", !user);
  $("headerUsername").textContent = user
    ? (user.user_metadata?.full_name || user.email || "Profile")
    : "Profile";

  $("adminNav").classList.toggle("hidden", !isAdmin());
  $("uploadOpen").title = user ? "Upload a video" : "Sign in to upload";
}

$("authOpen").addEventListener("click", async () => {
  if (user) {
    const { error } = await db.auth.signOut();
    if (error) alert(error.message);
    user = null;
    updateAuthUi();
    currentVideo = null;
    await loadPage("home");
  } else {
    message("authMessage", "");
    showModal("authModal");
  }
});

$("authOpen").addEventListener("dblclick", () => {});

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = event.submitter;
  setBusy(button, true);

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });

    if (error) throw error;
    user = data.user;
    closeModal("authModal");
    await afterLogin();
  } catch (error) {
    message("authMessage", error.message || "Sign-in failed.", true);
  } finally {
    setBusy(button, false, "Sign in");
  }
});

$("signup").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || password.length < 6) {
    message("authMessage", "Enter an email and a password of at least 6 characters.", true);
    return;
  }

  const button = $("signup");
  setBusy(button, true);

  try {
    const requestedName = email.split("@")[0].replace(/[^a-zA-Z0-9_]/g, "").slice(0, 30);
    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: {
        data: { username: requestedName || "creator" },
        emailRedirectTo: location.origin + location.pathname
      }
    });

    if (error) throw error;

    if (data.session) {
      user = data.user;
      closeModal("authModal");
      await afterLogin();
    } else {
      message("authMessage", "Account created. Check your email to confirm your address, then sign in.");
    }
  } catch (error) {
    message("authMessage", error.message || "Sign-up failed.", true);
  } finally {
    setBusy(button, false, "Create account");
  }
});

$("googleLogin").addEventListener("click", async () => {
  try {
    const { error } = await db.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.href.split("#")[0] }
    });
    if (error) throw error;
  } catch (error) {
    message("authMessage", error.message, true);
  }
});

db.auth.onAuthStateChange((_event, session) => {
  user = session?.user || null;
  updateAuthUi();
});

async function ensureProfile() {
  if (!user) return null;

  let profile = await getProfile(user.id);
  if (profile) return profile;

  const metadataName = user.user_metadata?.username ||
    user.user_metadata?.full_name ||
    user.email?.split("@")[0] ||
    "creator";

  const baseName = String(metadataName)
    .trim()
    .replace(/[^a-zA-Z0-9_.-]/g, "")
    .slice(0, 35) || "creator";

  const { error } = await db.from("profiles").insert({
    id: user.id,
    username: baseName,
    about: ""
  });

  if (error && !/duplicate|unique/i.test(error.message)) {
    console.warn("Could not create profile:", error.message);
  }

  return await getProfile(user.id);
}

async function afterLogin() {
  updateAuthUi();
  await ensureProfile();
  await ensureLowVRSubscription();
  await loadPage("home");
}

async function ensureLowVRSubscription() {
  if (!user) return;

  const { data: creator } = await db.from("profiles")
    .select("id")
    .ilike("username", "LowVR")
    .maybeSingle();

  if (!creator || creator.id === user.id) return;

  const { error } = await db.from("subscriptions").upsert(
    { subscriber_id: user.id, channel_id: creator.id },
    { onConflict: "subscriber_id,channel_id", ignoreDuplicates: true }
  );

  if (error) console.warn("Subscription setup:", error.message);
}

/* ========== NAVIGATION & SEARCH ========== */

document.querySelectorAll(".nav[data-page]").forEach(button => {
  button.addEventListener("click", () => loadPage(button.dataset.page));
});

$("homeLogo").addEventListener("click", () => loadPage("home"));
$("backBrowse").addEventListener("click", () => loadPage("home"));
$("profileBack").addEventListener("click", () => loadPage("home"));

$("searchForm").addEventListener("submit", async event => {
  event.preventDefault();
  searchTerm = $("searchInput").value.trim();
  currentCategory = "All";
  await loadPage("home");
});

$("chips").addEventListener("click", event => {
  const button = event.target.closest("[data-category]");
  if (!button) return;

/* ========== VIDEO BROWSING ========== */

async function loadVideos(page) {
  $("content").innerHTML = '<div class="empty">Loading videos…</div>';

  let query = db.from("videos")
    .select("id,title,description,category,video_url,thumbnail_url,created_at,user_id,is_private,comments_enabled,view_count,profiles(username,avatar_url,is_verified)")
    .eq("is_private", false)
    .order(page === "trending" ? "view_count" : "created_at", { ascending: false })
    .limit(100);

  if (page === "myvideos") query = query.eq("user_id", user.id);

  if (page === "subscriptions") {
    const { data: subs, error: subError } = await db.from("subscriptions")
      .select("channel_id")
      .eq("subscriber_id", user.id);

    if (subError) {
      $("content").innerHTML = "";
      message("status", subError.message, true);
      return;
    }

    const ids = (subs || []).map(row => row.channel_id);
    if (!ids.length) {
      $("content").innerHTML = '<div class="empty">Subscribe to creators to see their videos here.</div>';
      return;
    }

    query = query.in("user_id", ids);
  }

  const { data, error } = await query;

  if (error) {
    $("content").innerHTML = "";
    message("status", "Could not load videos: " + error.message, true);
    return;
  }

  allVideos = data || [];

  if (page === "trending") {
    allVideos.sort((a,b) => Number(b.view_count || 0) - Number(a.view_count || 0));
  }

  renderVideoGrid(allVideos);
}

function filteredVideos(videos) {
  return videos.filter(video => {
    const matchesCategory = currentCategory === "All" ||
      video.category === currentCategory;

    const haystack = [
      video.title, video.description, video.category,
      video.profiles?.username
    ].join(" ").toLowerCase();

    return matchesCategory && haystack.includes(searchTerm.toLowerCase());
  });
}

function renderVideoGrid(videos) {
  const filtered = filteredVideos(videos);
  const content = $("content");

  if (!filtered.length) {
    content.innerHTML = '<div class="empty">No videos found. Try another search or category.</div>';
    return;
  }

  content.innerHTML = filtered.map(video => {
    const thumb = safeHttpUrl(video.thumbnail_url);
    const creator = video.profiles?.username || "Creator";
    const count = Number(video.view_count || 0);

    return `
      <article class="video" data-video-id="${esc(video.id)}" tabindex="0" role="button" aria-label="Watch ${esc(video.title)}">
        <div class="thumb">
          ${thumb ? `<img src="${esc(thumb)}" loading="lazy" alt="">` : ""}
          <span class="play">▶</span>
        </div>
        <div style="display:flex;gap:10px;margin-top:10px">
          ${avatarHtml(creator, safeHttpUrl(video.profiles?.avatar_url))}
          <div style="min-width:0">
            <h3>${esc(video.title)}</h3>
            <div class="meta">${esc(creator)} ${video.profiles?.is_verified ? "✓" : ""}</div>
            <div class="meta">${count.toLocaleString()} views · ${esc(video.category || "Other")}</div>
          </div>
        </div>
      </article>`;
  }).join("");

  content.querySelectorAll("[data-video-id]").forEach(card => {
    const open = () => openVideo(card.dataset.videoId);
    card.addEventListener("click", open);
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {

}

/* ========== VIDEO PLAYER & VIEWS ========== */

async function openVideo(id) {
  const video = allVideos.find(item => String(item.id) === String(id));

  let selected = video;

  if (!selected) {
    const { data, error } = await db.from("videos")
      .select("id,title,description,category,video_url,thumbnail_url,created_at,user_id,is_private,comments_enabled,view_count,profiles(username,avatar_url,is_verified)")
      .eq("id", id)
      .maybeSingle();

    if (error || !data) {
      alert("Video not found or unavailable.");
      return;
    }
    selected = data;
  }

  if (selected.is_private && selected.user_id !== user?.id) {
    alert("This video is private.");
    return;
  }

  currentVideo = selected;
  showView("watch");

  $("watchTitle").textContent = selected.title || "Untitled video";
  $("watchDescription").textContent = selected.description || "No description.";
  $("watchChannel").textContent = selected.profiles?.username || "Creator";
  $("watchAvatar").innerHTML = esc(initials(selected.profiles?.username));
  $("watchSubs").textContent = "";
  $("watchStats").textContent =
    `${Number(selected.view_count || 0).toLocaleString()} views · ${selected.category || "Other"}`;

  const player = $("watchPlayer");
  player.pause();
  player.src = safeHttpUrl(selected.video_url);
  player.poster = safeHttpUrl(selected.thumbnail_url);
  player.load();

  $("subscribeBtn").classList.toggle("hidden", !user || user.id === selected.user_id);
  $("creatorTools").classList.toggle("hidden", !user || user.id !== selected.user_id);
  $("toggleCommentsBtn").textContent = selected.comments_enabled === false
    ? "Enable comments" : "Disable comments";
  $("togglePrivateBtn").textContent = selected.is_private ? "Make public" : "Make private";

  const profile = await getProfile(selected.user_id);
  if (profile) {
    $("watchChannel").innerHTML = `${esc(profile.username)} ${verifiedHtml(profile)}`;
    const avatarUrl = await privateMediaUrl(profile.avatar_url);
    $("watchAvatar").innerHTML = avatarUrl
      ? `<img src="${esc(avatarUrl)}" alt="">`
      : esc(initials(profile.username));
  }

  const owner = user?.id === selected.user_id;
  $("toggleCommentsBtn").disabled = !owner;
  $("togglePrivateBtn").disabled = !owner;

  await loadReactions();
  await loadComments();
  await loadRecommendations();

  message("watchNotice", "");

  // Increment the view count once when this video is opened.
  // The videos RLS policy must allow viewers to update view_count safely,
  // or this will be rejected by Supabase.
  if (!owner) {
    const nextCount = Number(selected.view_count || 0) + 1;
    const { error } = await db.from("videos")
      .update({ view_count: nextCount })
      .eq("id", selected.id)
      .eq("is_private", false);

    if (!error) {
      selected.view_count = nextCount;
      $("watchStats").textContent =
        `${nextCount.toLocaleString()} views · ${selected.category || "Other"}`;
    }
  }
}

async function react(kind) {
  if (!user) {
    showModal("authModal");
    message("authMessage", "Sign in to react to videos.");
    return;
  }
  if (!currentVideo) return;

  try {
    const { data: existing, error: checkError } = await db.from("reactions")
      .select("reaction")
      .eq("video_id", currentVideo.id)
      .eq("user_id", user.id)
      .maybeSingle();

    if (checkError) throw checkError;

    let result;
    if (existing?.reaction === kind) {
      result = await db.from("reactions").delete()
        .eq("video_id", currentVideo.id)
        .eq("user_id", user.id);
    } else {
      result = await db.from("reactions").upsert({
        video_id: currentVideo.id,
        user_id: user.id,
        reaction: kind
      }, { onConflict: "video_id,user_id" });
    }

    if (result.error) throw result.error;
    await loadReactions();
  } catch (error) {
    message("watchNotice", error.message, true);
  }
}

$("shareBtn").addEventListener("click", async () => {
  if (!currentVideo) return;

  const url = `${location.origin}${location.pathname}?video=${encodeURIComponent(currentVideo.id)}`;

  try {
    if (navigator.share) {
      await navigator.share({ title: currentVideo.title, url });
    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(url);
      message("watchNotice", "Video link copied.");
    } else {
      prompt("Copy this video link:", url);
    }
  } catch (error) {
    if (error.name !== "AbortError") message("watchNotice", "Could not share this video.", true);
  }
});

async function uploadProfileImage(file, kind) {
  if (!user || !file) return null;

  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
    throw new Error("Choose a PNG, JPEG or WebP image.");
  }

  if (file.size > 5 * 1024 * 1024) {
    throw new Error("Profile images must be 5 MB or smaller.");
  }

  const extension = ({ "image/png":"png", "image/jpeg":"jpg", "image/webp":"webp" })[file.type];
  const path = `${user.id}/${kind}-${crypto.randomUUID()}.${extension}`;

  const { error } = await db.storage.from(MEDIA_BUCKET).upload(path, file, {
    upsert: false,
    contentType: file.type
  });

  if (error) throw error;
  return path;
}

async function openProfile(id) {
  if (!id) return;

  showView("profile");
  $("profileVideos").innerHTML = '<div class="empty">Loading profile…</div>';
  $("profileEditPanel").classList.add("hidden");

    $("profileName").innerHTML = `${esc(profile.username)} ${verifiedHtml(profile)}`;
    $("profileEmail").textContent = id === user?.id ? (user.email || "Your channel") : "Loobee creator";
    $("profileAbout").textContent = profile.about || "This creator hasn't added a description yet.";

    const [avatarUrl, bannerUrl] = await Promise.all([
      privateMediaUrl(profile.avatar_url),
      privateMediaUrl(profile.banner_url)
    ]);

    $("profileAvatar").innerHTML = avatarUrl
      ? `<img src="${esc(avatarUrl)}" alt="Profile picture">`
      : esc(initials(profile.username));

      .select("id,title,description,category,video_url,thumbnail_url,created_at,user_id,is_private,comments_enabled,view_count,profiles(username,avatar_url,is_verified)")
      .eq("user_id", id)
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) throw error;

    allVideos = videos || [];
    renderProfileVideos(allVideos);
    await updateProfileSubscribeButton();

    $("profileVideos").innerHTML = "";
    message("profileNotice", error.message, true);

$("profileForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!user || currentProfile?.id !== user.id) return;

  const button = event.submitter;
  setBusy(button, true);

  try {
    const username = $("profileUsernameInput").value.trim();
    const about = $("profileAboutInput").value.trim();

    if (!/^[a-zA-Z0-9_.-]{3,40}$/.test(username)) {
      throw new Error("Username must be 3–40 characters and use only letters, numbers, dots, underscores or hyphens.");
    }

    const updates = { username, about };

    const avatarFile = $("profileAvatarFile").files[0];
    const bannerFile = $("profileBannerFile").files[0];

    if (avatarFile) updates.avatar_url = await uploadProfileImage(avatarFile, "avatar");
    if (bannerFile) updates.banner_url = await uploadProfileImage(bannerFile, "banner");

    const { error } = await db.from("profiles")
      .update(updates)
      .eq("id", user.id);

    if (error) {
      if (/duplicate|unique/i.test(error.message)) {
        throw new Error("Username taken. Please choose another username.");
      }
      throw error;
    }

    $("profileAvatarFile").value = "";
    $("profileBannerFile").value = "";
    $("profileEditPanel").classList.add("hidden");
    await openProfile(user.id);
  } catch (error) {
    message("profileNotice", error.message, true);
  } finally {
    setBusy(button, false, "Save profile");
  }
});

async function uploadFile(bucket, file, path) {
  const { error } = await db.storage.from(bucket).upload(path, file, {
    upsert: false,
    contentType: file.type
  });

  if (error) throw error;

  const { data } = db.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

$("uploadForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!user) {
    message("uploadMessage", "Sign in to upload.", true);
    return;
  }

  const button = event.submitter;
  setBusy(button, true);

  let videoPath = null;
  let thumbnailPath = null;

  try {
    const title = $("videoTitle").value.trim();
    const description = $("videoDescription").value.trim();
    const category = $("videoCategory").value;
    const videoFile = $("videoFile").files[0];
    const thumbnailFile = $("thumbnailFile").files[0];

    if (!title) throw new Error("Enter a title.");
    if (!videoFile) throw new Error("Choose a video file.");
    if (!videoFile.type.startsWith("video/")) throw new Error("Choose a valid video file.");
    if (videoFile.size > MAX_VIDEO_SIZE) throw new Error("Video must be 500 MB or smaller.");

    const videoExt = videoFile.name.split(".").pop().replace(/[^a-zA-Z0-9]/g, "").slice(0, 10) || "mp4";
    videoPath = `${user.id}/${crypto.randomUUID()}.${videoExt}`;

    const { error: videoError } = await db.storage.from("videos").upload(videoPath, videoFile, {
      upsert: false,
      contentType: videoFile.type
    });
    if (videoError) throw videoError;

    const { data: videoPublic } = db.storage.from("videos").getPublicUrl(videoPath);
    const videoUrl = videoPublic.publicUrl;

    let thumbnailUrl = null;

    if (thumbnailFile) {
      if (!/^image\/(png|jpeg|webp)$/.test(thumbnailFile.type)) {
        throw new Error("Thumbnail must be PNG, JPEG or WebP.");
      }
      if (thumbnailFile.size > 5 * 1024 * 1024) {
        throw new Error("Thumbnail must be 5 MB or smaller.");
      }

      const thumbExt = ({ "image/png":"png", "image/jpeg":"jpg", "image/webp":"webp" })[thumbnailFile.type];
      thumbnailPath = `${user.id}/${crypto.randomUUID()}.${thumbExt}`;

      const { error: thumbError } = await db.storage.from("thumbnails").upload(thumbnailPath, thumbnailFile, {
        upsert: false,
        contentType: thumbnailFile.type
      });
      if (thumbError) throw thumbError;

      const { data: thumbPublic } = db.storage.from("thumbnails").getPublicUrl(thumbnailPath);
      thumbnailUrl = thumbPublic.publicUrl;
    }

    const { error: insertError } = await db.from("videos").insert({
      title,
      description,
      category,
      video_url: videoUrl,
      thumbnail_url: thumbnailUrl,
      user_id: user.id,
      is_private: $("uploadPrivate").checked,
      comments_enabled: true
    });

    if (insertError) throw insertError;

    closeModal("uploadModal");
    await loadPage("myvideos");
  } catch (error) {
    message("uploadMessage", error.message || "Upload failed.", true);
  } finally {
    setBusy(button, false, "Upload video");
  }
});

/* ========== LIVE STREAM LISTINGS ========== */

async function loadLiveStreams() {
  $("content").className = "";
  $("content").innerHTML = `
    ${user ? `<div class="panel">
      <h2>Create a live-stream listing</h2>
      <p class="meta">Add the link to your stream. This creates a listing; it does not broadcast video itself.</p>
      <form id="liveForm">
        <label for="liveTitle">Stream title</label>
        <input id="liveTitle" maxlength="120" required>
        <label for="liveDescription">Description</label>
        <textarea id="liveDescription" maxlength="2000" rows="3"></textarea>
        <label for="liveUrl">Stream URL (HTTPS)</label>
        <input id="liveUrl" type="url" placeholder="https://…" required>
        <label for="liveThumb">Thumbnail URL (optional)</label>
        <input id="liveThumb" type="url" placeholder="https://…">
        <button class="primary" type="submit">Publish listing</button>
      </form>
      <div id="liveStatus" class="status"></div>
    </div>` : '<div class="panel">Sign in to publish a live-stream listing.</div>'}
    <h2>Live now</h2><div id="liveList"><div class="empty">Loading listings…</div></div>`;

  $("liveForm")?.addEventListener("submit", async event => {
    event.preventDefault();

    const title = $("liveTitle").value.trim();
    const streamUrl = safeHttpUrl($("liveUrl").value.trim());
    const thumbnailUrl = $("liveThumb").value.trim()
      ? safeHttpUrl($("liveThumb").value.trim()) : null;

    if (!streamUrl || !streamUrl.startsWith("https://")) {
      message("liveStatus", "Enter a valid HTTPS stream URL.", true);
      return;
    }

    if ($("liveThumb").value.trim() && !thumbnailUrl) {
      message("liveStatus", "Enter a valid HTTPS thumbnail URL.", true);
      return;
    }

    const button = event.submitter;
    setBusy(button, true);

    try {
      const { error } = await db.from("live_streams").insert({
        user_id: user.id,
        title,
        description: $("liveDescription").value.trim(),
        stream_url: streamUrl,
        thumbnail_url: thumbnailUrl,
        is_live: true
      });

      if (error) throw error;
      await loadLiveStreams();
    } catch (error) {
      message("liveStatus", error.message, true);
    } finally {
      setBusy(button, false, "Publish listing");
    }
  });

  const { data, error } = await db.from("live_streams")
    .select("id,user_id,title,description,stream_url,thumbnail_url,is_live,created_at,profiles(username,is_verified)")
    .eq("is_live", true)
    .order("created_at", { ascending: false })
    .limit(100);

  const list = $("liveList");
  if (!list) return;

  if (error) {
    list.innerHTML = "";
    message("status", "Could not load streams: " + error.message, true);
    return;
  }

  list.innerHTML = (data || []).map(stream => {
    const url = safeHttpUrl(stream.stream_url);
    const thumb = safeHttpUrl(stream.thumbnail_url);

    return `<article class="stream-card">
      <div style="display:flex;gap:15px;align-items:flex-start;flex-wrap:wrap">
        ${thumb ? `<img src="${esc(thumb)}" alt="" style="width:180px;max-width:100%;border-radius:9px">` : ""}
        <div style="flex:1;min-width:180px">
          <div class="meta">● LIVE LISTING</div>
          <h3>${esc(stream.title)}</h3>
          <p>${esc(stream.description || "")}</p>
          <p class="meta">${esc(stream.profiles?.username || "Creator")} ${verifiedHtml(stream.profiles)}</p>
          ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:#b9a1ff">Open stream ↗</a>` : ""}
          ${user?.id === stream.user_id ? `<button data-end-stream="${esc(stream.id)}">End listing</button>` : ""}
        </div>
      </div>
    </article>`;
  }).join("") || '<div class="empty">No live-stream listings right now.</div>';

  list.querySelectorAll("[data-end-stream]").forEach(button => {
    button.addEventListener("click", async () => {
      const { error } = await db.from("live_streams")
        .update({ is_live: false })
        .eq("id", button.dataset.endStream)
        .eq("user_id", user.id);

      if (error) message("status", error.message, true);
      else await loadLiveStreams();
    });
  });
}

/* ========== ADMIN: VERIFIED CREATORS ========== */

async function loadAdminPanel() {
  if (!isAdmin()) {
    await loadPage("home");
    return;
  }

  $("content").className = "";
  $("content").innerHTML = `
    <section class="panel">
      <h2>Creator verification</h2>
      <p class="meta">Signed in as ${esc(user.email)}. Search by username or account ID.</p>
      <input id="adminSearch" placeholder="Search accounts…">
      <div id="adminStatus" class="status"></div>
      <div id="adminResults"><div class="empty">Loading accounts…</div></div>
    </section>`;

  const { data, error } = await db.from("profiles")
    .select("id,username,about,is_verified,created_at")
    .order("username")
    .limit(500);

  if (error) {
    $("adminResults").innerHTML = "";
    message("adminStatus", error.message, true);
    return;
  }

  const profiles = data || [];

  function renderAdminResults() {
    const term = $("adminSearch").value.trim().toLowerCase();
    const matches = profiles.filter(profile =>
      String(profile.username || "").toLowerCase().includes(term) ||
      String(profile.id).toLowerCase().includes(term)
    );

    $("adminResults").innerHTML = matches.map(profile => `
      <div class="channel-card">
        <strong>${esc(profile.username)} ${verifiedHtml(profile)}</strong>
        <p class="meta">Account ID: ${esc(profile.id)}</p>
        <p class="meta">Created: ${esc(profile.created_at || "Unknown")}</p>
        <button data-verify-user="${esc(profile.id)}" data-next-verified="${!profile.is_verified}">
          ${profile.is_verified ? "Revoke verification" : "Grant verification"}
        </button>
      </div>`).join("") || '<div class="empty">No matching accounts.</div>';

    $("adminResults").querySelectorAll("[data-verify-user]").forEach(button => {
      button.addEventListener("click", async () => {
        if (!isAdmin()) return;

        const id = button.dataset.verifyUser;
        const next = button.dataset.nextVerified === "true";
        const target = profiles.find(p => p.id === id);
        if (!target) return;

        button.disabled = true;

        try {
          const { error } = await db.from("profiles")
            .update({ is_verified: next })
            .eq("id", id);

          if (error) throw error;

          target.is_verified = next;
          message("adminStatus", `${target.username}: verification ${next ? "granted" : "revoked"}.`);
          renderAdminResults();
        } catch (error) {
          message("adminStatus", "Could not update verification: " + error.message, true);
          button.disabled = false;
        }
      });
    });
  }

  $("adminSearch").addEventListener("input", renderAdminResults);
  renderAdminResults();
}

/* ========== BOOT ========== */

async function boot() {
  if (location.protocol === "file:") {
    console.warn("For OAuth and hosted storage, run Loobee through GitHub Pages or a local web server.");
  }

  try {
    await refreshAuth();
    if (user) await ensureProfile();

    const params = new URLSearchParams(location.search);
    const videoId = params.get("video");

    if (videoId) {
      await openVideo(videoId);
    } else {
      await loadPage("home");
    }
  } catch (error) {
    console.error("Loobee startup failed:", error);
    message("status", "Loobee could not start: " + error.message, true);
  }
}

boot();
